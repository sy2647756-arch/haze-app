name: Deploy Flutter Web to GitHub Pages

# 每次推送到 main 分支时，自动构建并部署网页
on:
  push:
    branches: [ main ]
  # 也允许在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安装 Flutter（稳定版）
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 构建并部署到 gh-pages 分支
      # workingDir: Flutter 项目所在的子目录（仓库里是 mood_quiz/）
      # baseHref:   因为部署在 用户名.github.io/mood_quiz/ 这个子路径下，必须设置
      - uses: bluefireteam/flutter-gh-pages@v9
        with:
          workingDir: mood_quiz
          baseHref: /mood_quiz/
