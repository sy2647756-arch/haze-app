name: Deploy Flutter Web to GitHub Pages

# 每次推送到 main 分支时，自动构建并部署网页
on:
  push:
    branches: [ main ]
  # 也允许在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 需要写权限，否则 action 无法推送到 gh-pages 分支（会以 exit code 128 失败）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # 安装 Flutter（稳定版）
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 构建并部署到 gh-pages 分支
      # workingDir: Flutter 项目所在的子目录（仓库里是 mood_quiz/）
      # baseHref:   因为部署在 用户名.github.io/mood_quiz/ 这个子路径下，必须设置
      - uses: bluefireteam/flutter-gh-pages@v9
        with:
          workingDir: mood_quiz
          baseHref: /mood_quiz/
          # 把 CanvasKit 打包进产物，不从 gstatic CDN 拉取（部分网络环境下会白屏）
          customArgs: --no-web-resources-cdn
